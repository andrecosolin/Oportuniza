<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Oportuniza</title>
<style>
body{margin:0;width:260px;font:13px/1.4 system-ui,sans-serif;background:#1B2430;color:#F1F3F6}
main{padding:14px}
h1{font-size:15px;margin:0 0 8px;color:#F4A06B}
p{margin:6px 0;color:#C9D0DA}
b{color:#F1F3F6}
label{display:flex;gap:8px;align-items:center;margin-top:10px;cursor:pointer}
</style></head>
<body><main>
<h1>Oportuniza</h1>
<p>Abra uma busca, categoria ou anúncio do Mercado Livre e o painel aparece no canto da tela.</p>
<p>Páginas registradas: <b id="pages">0</b><br>Leituras salvas: <b id="sent">0</b><br>Última: <b id="last">–</b></p>
<label><input type="checkbox" id="paused"> Pausar registro (só mostrar)</label>
<div style="margin-top:12px"><span style="font-size:12px;color:#A9B2BF">Chave (Oportuniza > Minha conta > Acessos)</span>
<div style="display:flex;gap:6px;margin-top:4px"><input id="key" type="password" style="flex:1;min-width:0;background:#263040;color:#F1F3F6;border:1px solid #2E3744;border-radius:6px;padding:6px"><button id="save" style="background:#E8692A;color:#1B2430;border:0;border-radius:6px;padding:6px 10px;font-weight:600;cursor:pointer">Salvar</button></div>
<p id="kmsg" style="font-size:12px"></p></div>
<p><a href="https://andrecosolin.github.io/Oportuniza/" target="_blank" style="color:#F4A06B">Abrir o Oportuniza</a></p>
</main>
<script src="popup.js"></script>
</body></html>
